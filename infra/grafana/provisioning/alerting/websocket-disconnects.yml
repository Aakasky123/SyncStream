apiVersion: 1

groups:
  - orgId: 1
    name: syncstream-alerts
    folder: SyncStream
    interval: 1m
    rules:
      - uid: syncstream-websocket-disconnect-rate
        title: WebSocket disconnect rate above 5 percent
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "sum(rate(syncstream_websocket_disconnect_total[1m])) / clamp_min(sum(syncstream_active_websocket_connections), 1)"
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "WebSocket disconnect rate is above 5% for 1 minute."
        labels:
          service: syncstream
