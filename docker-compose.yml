services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: syncstream
      POSTGRES_USER: syncstream
      POSTGRES_PASSWORD: syncstream
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncstream -d syncstream"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-instance-1:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      INSTANCE_ID: backend-instance-1
      DATABASE_URL: jdbc:postgresql://postgres:5432/syncstream
      DATABASE_USERNAME: syncstream
      DATABASE_PASSWORD: syncstream
      REDIS_HOST: redis
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: syncstream-compose-secret-change-me-syncstream-compose-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend-instance-2:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      INSTANCE_ID: backend-instance-2
      DATABASE_URL: jdbc:postgresql://postgres:5432/syncstream
      DATABASE_USERNAME: syncstream
      DATABASE_PASSWORD: syncstream
      REDIS_HOST: redis
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: syncstream-compose-secret-change-me-syncstream-compose-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend-instance-1
      - backend-instance-2
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v3.8.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend-instance-1
      - backend-instance-2
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3001:3000"

volumes:
  postgres-data:
